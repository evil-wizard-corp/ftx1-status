name: Release
# Runs when you push a v* tag by hand (for example a v0.3.0-beta.1 pre-release), and when
# auto-release.yml calls it with the next version. In the second case the tag doesn't exist yet;
# `gh release create` makes it at the checked-out commit.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Tag to release, like v1.2.3
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - run: swift test

      - name: Build universal app
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          VERSION="${TAG#v}" UNIVERSAL=1 ./build-app.sh
          lipo -info "build/FTX1 Status.app/Contents/MacOS/FTX1Status"
          "build/FTX1 Status.app/Contents/MacOS/FTX1Status" --version | grep -qx "${TAG#v}"

      - name: Zip
        run: |
          ZIP="FTX1-Status-$VERSION.zip"
          ditto -c -k --keepParent "build/FTX1 Status.app" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$TAG" "$ZIP" $PRERELEASE --target "$(git rev-parse HEAD)" --title "FTX1 Status $VERSION" --generate-notes --notes "$(cat <<NOTES
          Install with Homebrew:

              brew install --cask evil-wizard-corp/tap/ftx1-status

          Or download the zip below. The app is not notarized; if macOS blocks it, run
          \`xattr -dr com.apple.quarantine "/Applications/FTX1 Status.app"\` or use
          System Settings → Privacy & Security → Open Anyway.

          SHA-256: \`$SHA\`
          NOTES
          )"

      - name: Update Homebrew tap
        if: ${{ !contains(env.TAG, '-') }}
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:evil-wizard-corp/homebrew-tap.git tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/ftx1-status.rb
          # Fail loudly if the cask's layout changed and sed matched nothing.
          grep -q "^  version \"$VERSION\"" Casks/ftx1-status.rb
          grep -q "^  sha256 \"$SHA\"" Casks/ftx1-status.rb
          if git diff --quiet; then
            echo "Cask already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ftx1-status $VERSION"
          git push
